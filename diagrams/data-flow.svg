<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
  <title>aisqltuner-index-tuner data flow</title>
  <desc>Data flows from your database through five stages: collect diagnostics, ask your own Azure OpenAI deployment, store recommendations, validate them, and apply the verified changes with an undo script. RECOMMEND mode stops after storing; CREATE mode continues.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F6FD"/>
    </linearGradient>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A5CAD"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B2545" flood-opacity="0.10"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2563EB"/>
    </marker>
    <marker id="arAz" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0078D4"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Header -->
  <text x="40" y="42" font-size="14" font-weight="700" letter-spacing="2.5" fill="#2563EB">AISQLTUNER-INDEX-TUNER</text>
  <text x="40" y="88" font-size="46" font-weight="800" fill="#0B2545">Data flow</text>
  <text x="40" y="120" font-size="20" fill="#475569">From your database to a verified index, in five steps</text>
  <rect x="1330" y="46" width="230" height="36" rx="18" fill="#0B2545"/>
  <text x="1445" y="70" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Open source · MIT license</text>

  <!-- Azure OpenAI -->
  <rect x="340" y="135" width="294" height="80" rx="14" fill="url(#azure)" filter="url(#sh)"/>
  <g transform="translate(362 158)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M8 26a7 7 0 0 1 1-13.9A9 9 0 0 1 26.5 14 6 6 0 0 1 26 26z"/>
  </g>
  <text x="410" y="170" font-size="21" font-weight="700" fill="#FFFFFF">Azure OpenAI</text>
  <text x="410" y="192" font-size="14" fill="#CFE6FA">your own deployment</text>
  <line x1="447" y1="263" x2="447" y2="219" stroke="#0078D4" stroke-width="2.5" marker-end="url(#arAz)"/>
  <text x="437" y="246" font-size="12.5" fill="#64748B" text-anchor="end">prompt + payload</text>
  <line x1="527" y1="219" x2="527" y2="263" stroke="#0078D4" stroke-width="2.5" marker-end="url(#arAz)"/>
  <text x="537" y="246" font-size="12.5" fill="#64748B">JSON answer</text>
  <g transform="translate(672 152)" fill="none" stroke="#0B2545" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="3" y="12" width="20" height="15" rx="3"/>
    <path d="M7 12V8a6 6 0 0 1 12 0v4"/>
  </g>
  <text x="712" y="170" font-size="16" font-weight="700" fill="#0B2545">The only place data leaves your database</text>
  <text x="712" y="192" font-size="14" fill="#64748B">Sent to the Azure OpenAI deployment you configure, and nowhere else</text>

  <!-- Stage 1: Collect -->
  <rect x="40" y="265" width="270" height="245" rx="16" fill="#FFFFFF" stroke="#CBDAF2" filter="url(#sh)"/>
  <circle cx="76" cy="303" r="18" fill="#2563EB"/>
  <text x="76" y="310" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="104" y="311" font-size="24" font-weight="700" fill="#0B2545">Collect</text>
  <text x="64" y="342" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="13" fill="#2563EB">usp_CollectData</text>
  <line x1="64" y1="356" x2="286" y2="356" stroke="#E2E8F0"/>
  <g font-size="14.5" fill="#334155">
    <circle cx="68" cy="384" r="3" fill="#2563EB"/><text x="80" y="389">Missing indexes and usage stats</text>
    <circle cx="68" cy="412" r="3" fill="#2563EB"/><text x="80" y="417">Plan cache and Query Store</text>
    <circle cx="68" cy="440" r="3" fill="#2563EB"/><text x="80" y="445">Non-SARGable predicates, skew</text>
    <circle cx="68" cy="468" r="3" fill="#2563EB"/><text x="80" y="473">Read-only, scoped by table</text>
  </g>

  <!-- Stage 2: Ask -->
  <rect x="352" y="265" width="270" height="245" rx="16" fill="#FFFFFF" stroke="#CBDAF2" filter="url(#sh)"/>
  <circle cx="388" cy="303" r="18" fill="#2563EB"/>
  <text x="388" y="310" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="416" y="311" font-size="24" font-weight="700" fill="#0B2545">Ask</text>
  <text x="376" y="342" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="13" fill="#2563EB">usp_InvokeModel</text>
  <line x1="376" y1="356" x2="598" y2="356" stroke="#E2E8F0"/>
  <g font-size="14.5" fill="#334155">
    <circle cx="380" cy="384" r="3" fill="#2563EB"/><text x="392" y="389">System prompt plus payload</text>
    <circle cx="380" cy="412" r="3" fill="#2563EB"/><text x="392" y="417">Schema-enforced JSON answer</text>
    <circle cx="380" cy="440" r="3" fill="#2563EB"/><text x="392" y="445">Background mode with polling</text>
    <circle cx="380" cy="468" r="3" fill="#2563EB"/><text x="392" y="473">Your key or managed identity</text>
  </g>

  <!-- Stage 3: Store -->
  <rect x="664" y="265" width="270" height="245" rx="16" fill="#FFFFFF" stroke="#CBDAF2" filter="url(#sh)"/>
  <circle cx="700" cy="303" r="18" fill="#2563EB"/>
  <text x="700" y="310" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="728" y="311" font-size="24" font-weight="700" fill="#0B2545">Store</text>
  <text x="688" y="342" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="13" fill="#2563EB">AIIndexTuner.Recommendation</text>
  <line x1="688" y1="356" x2="910" y2="356" stroke="#E2E8F0"/>
  <g font-size="14.5" fill="#334155">
    <circle cx="692" cy="384" r="3" fill="#2563EB"/><text x="704" y="389">One row per recommendation</text>
    <circle cx="692" cy="412" r="3" fill="#2563EB"/><text x="704" y="417">Priority, confidence, est. MB</text>
    <circle cx="692" cy="440" r="3" fill="#2563EB"/><text x="704" y="445">Keys, includes, rationale</text>
    <circle cx="692" cy="468" r="3" fill="#2563EB"/><text x="704" y="473">Model script kept for review</text>
  </g>

  <!-- Stage 4: Validate -->
  <rect x="976" y="265" width="270" height="245" rx="16" fill="#FFFFFF" stroke="#CBDAF2" filter="url(#sh)"/>
  <circle cx="1012" cy="303" r="18" fill="#16A34A"/>
  <text x="1012" y="310" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1040" y="311" font-size="24" font-weight="700" fill="#0B2545">Validate</text>
  <text x="1000" y="342" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="13" fill="#15803D">usp_ApplyRecommendation</text>
  <line x1="1000" y1="356" x2="1222" y2="356" stroke="#E2E8F0"/>
  <g font-size="14.5" fill="#334155">
    <circle cx="1004" cy="384" r="3" fill="#16A34A"/><text x="1016" y="389">Names checked against catalog</text>
    <circle cx="1004" cy="412" r="3" fill="#16A34A"/><text x="1016" y="417">Priority and confidence floors</text>
    <circle cx="1004" cy="440" r="3" fill="#16A34A"/><text x="1016" y="445">Change controls enforced</text>
    <circle cx="1004" cy="468" r="3" fill="#16A34A"/><text x="1016" y="473">Unsafe drops are refused</text>
  </g>

  <!-- Stage 5: Apply -->
  <rect x="1288" y="265" width="270" height="245" rx="16" fill="#FFFFFF" stroke="#CBDAF2" filter="url(#sh)"/>
  <circle cx="1324" cy="303" r="18" fill="#16A34A"/>
  <text x="1324" y="310" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="1352" y="311" font-size="24" font-weight="700" fill="#0B2545">Apply</text>
  <text x="1312" y="342" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="13" fill="#15803D">CREATE INDEX · DROP INDEX</text>
  <line x1="1312" y1="356" x2="1534" y2="356" stroke="#E2E8F0"/>
  <g font-size="14.5" fill="#334155">
    <circle cx="1316" cy="384" r="3" fill="#16A34A"/><text x="1328" y="389">Builds the DDL itself</text>
    <circle cx="1316" cy="412" r="3" fill="#16A34A"/><text x="1328" y="417">ONLINE = ON where supported</text>
    <circle cx="1316" cy="440" r="3" fill="#16A34A"/><text x="1328" y="445">Tags every index it creates</text>
    <circle cx="1316" cy="468" r="3" fill="#16A34A"/><text x="1328" y="473">Stores UndoDDL for each change</text>
  </g>

  <!-- Arrows between stages -->
  <line x1="313" y1="387" x2="349" y2="387" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="625" y1="387" x2="661" y2="387" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="937" y1="387" x2="973" y2="387" stroke="#16A34A" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arG)"/>
  <line x1="1249" y1="387" x2="1285" y2="387" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arG)"/>

  <!-- Outputs -->
  <g stroke-width="1.2">
    <line x1="175" y1="512" x2="175" y2="534" stroke="#94A3B8" marker-end="url(#ar)"/>
    <line x1="487" y1="512" x2="487" y2="534" stroke="#94A3B8" marker-end="url(#ar)"/>
    <line x1="799" y1="512" x2="799" y2="534" stroke="#94A3B8" marker-end="url(#ar)"/>
    <line x1="1111" y1="512" x2="1111" y2="534" stroke="#94A3B8" marker-end="url(#arG)"/>
    <line x1="1423" y1="512" x2="1423" y2="534" stroke="#94A3B8" marker-end="url(#arG)"/>
  </g>
  <g>
    <rect x="40" y="540" width="270" height="74" rx="12" fill="#EAF1FE" stroke="#BFD3F6"/>
    <text x="58" y="562" font-size="11" font-weight="700" letter-spacing="1.6" fill="#64748B">OUTPUT</text>
    <text x="58" y="585" font-size="16" font-weight="700" fill="#0B2545">Diagnostics payload</text>
    <text x="58" y="604" font-size="13" fill="#475569">names, counts, plans, usage</text>

    <rect x="352" y="540" width="270" height="74" rx="12" fill="#EAF1FE" stroke="#BFD3F6"/>
    <text x="370" y="562" font-size="11" font-weight="700" letter-spacing="1.6" fill="#64748B">OUTPUT</text>
    <text x="370" y="585" font-size="16" font-weight="700" fill="#0B2545">Structured JSON</text>
    <text x="370" y="604" font-size="13" fill="#475569">a list of recommendations</text>

    <rect x="664" y="540" width="270" height="74" rx="12" fill="#EAF1FE" stroke="#BFD3F6"/>
    <text x="682" y="562" font-size="11" font-weight="700" letter-spacing="1.6" fill="#64748B">OUTPUT</text>
    <text x="682" y="585" font-size="16" font-weight="700" fill="#0B2545">Rows in your database</text>
    <text x="682" y="604" font-size="13" fill="#475569">ready for you to review</text>

    <rect x="976" y="540" width="270" height="74" rx="12" fill="#ECFDF3" stroke="#A7E3BC"/>
    <text x="994" y="562" font-size="11" font-weight="700" letter-spacing="1.6" fill="#64748B">OUTPUT</text>
    <text x="994" y="585" font-size="16" font-weight="700" fill="#0B2545">Approved or skipped</text>
    <text x="994" y="604" font-size="13" fill="#475569">every skip comes with a reason</text>

    <rect x="1288" y="540" width="270" height="74" rx="12" fill="#ECFDF3" stroke="#A7E3BC"/>
    <text x="1306" y="562" font-size="11" font-weight="700" letter-spacing="1.6" fill="#64748B">OUTPUT</text>
    <text x="1306" y="585" font-size="16" font-weight="700" fill="#0B2545">New indexes plus UndoDDL</text>
    <text x="1306" y="604" font-size="13" fill="#475569">tagged and reversible</text>
  </g>

  <!-- Mode bands -->
  <rect x="40" y="646" width="894" height="46" rx="23" fill="#DCE8FD" stroke="#9DBBF0"/>
  <text x="487" y="675" font-size="16" fill="#0B2545" text-anchor="middle"><tspan font-weight="800" letter-spacing="1.2" fill="#1D4ED8">RECOMMEND</tspan>  ·  the default: nothing in your database changes</text>
  <rect x="976" y="646" width="582" height="46" rx="23" fill="#DCFCE7" stroke="#86D9A5"/>
  <text x="1267" y="675" font-size="16" fill="#0B2545" text-anchor="middle"><tspan font-weight="800" letter-spacing="1.2" fill="#15803D">CREATE</tspan>  ·  applies only what passes validation</text>

  <!-- Callouts -->
  <g>
    <rect x="40" y="722" width="490" height="110" rx="14" fill="#FFFFFF" stroke="#CBDAF2" filter="url(#sh)"/>
    <g transform="translate(60 746)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <rect x="3" y="12" width="20" height="15" rx="3"/>
      <path d="M7 12V8a6 6 0 0 1 12 0v4"/>
    </g>
    <text x="104" y="752" font-size="17" font-weight="700" fill="#0B2545">Data disclosure</text>
    <text x="104" y="777" font-size="14" fill="#475569">Diagnostics go to your own Azure OpenAI endpoint</text>
    <text x="104" y="797" font-size="14" fill="#475569">and nowhere else. Set IncludeQueryText = 0 to omit</text>
    <text x="104" y="817" font-size="14" fill="#475569">query text.</text>

    <rect x="555" y="722" width="490" height="110" rx="14" fill="#FFFFFF" stroke="#CBDAF2" filter="url(#sh)"/>
    <g transform="translate(575 746)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M2 14s5-9 12-9 12 9 12 9-5 9-12 9S2 14 2 14z"/>
      <circle cx="14" cy="14" r="3.5"/>
    </g>
    <text x="619" y="752" font-size="17" font-weight="700" fill="#0B2545">Review first</text>
    <text x="619" y="777" font-size="14" fill="#475569">Stay in RECOMMEND and read the stored rows,</text>
    <text x="619" y="797" font-size="14" fill="#475569">then apply what you approve with</text>
    <text x="619" y="817" font-size="14" fill="#475569">sp_AIIndexTuner_Apply.</text>

    <rect x="1070" y="722" width="490" height="110" rx="14" fill="#FFFFFF" stroke="#CBDAF2" filter="url(#sh)"/>
    <g transform="translate(1090 746)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M8 6L3 11l5 5"/>
      <path d="M3 11h12a7 7 0 0 1 0 14h-5"/>
    </g>
    <text x="1134" y="752" font-size="17" font-weight="700" fill="#0B2545">Always reversible</text>
    <text x="1134" y="777" font-size="14" fill="#475569">Each applied change stores UndoDDL: drop the</text>
    <text x="1134" y="797" font-size="14" fill="#475569">index it created, or restore the one it dropped</text>
    <text x="1134" y="817" font-size="14" fill="#475569">or widened.</text>
  </g>

  <!-- Footer -->
  <line x1="40" y1="858" x2="1560" y2="858" stroke="#D5E0F2"/>
  <text x="40" y="883" font-size="15" font-weight="600" fill="#0B2545">github.com/AI-SQL-Tuner/aisqltuner-index-tuner</text>
  <text x="1560" y="883" font-size="15" fill="#64748B" text-anchor="end">Free and open source from AI SQL Tuner · aisqltuner.com</text>
</svg>
