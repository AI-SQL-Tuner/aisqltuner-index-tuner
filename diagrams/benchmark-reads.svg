<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
  <title>How much less data the read queries touch</title>
  <desc>Logical-read reduction per arm and scenario. The proc's applied advice is at or near the best arm in all three scenarios; the missing-index baseline is near-best on challenge and useless on sqlstorm-oltp.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B6B5AF" stroke-width="3"/>
    </pattern>
    <pattern id="hatchP" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#86b6ef" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="14" font-weight="700" letter-spacing="2.5" fill="#2563EB">AISQLTUNER-INDEX-TUNER · BENCHMARK</text>
  <text x="40" y="86" font-size="38" font-weight="800" fill="#0B2545">How much less data the read queries touch</text>
  <text x="40" y="118" font-size="19" fill="#475569">Change in logical reads after tuning, mean of 5 trials. Longer bar = bigger saving.</text>
  <rect x="40" y="147" width="16" height="16" rx="3" fill="#2a78d6"/>
  <text x="64" y="160" font-size="15" fill="#334155">sp_AIIndexTuner (this repo)</text>
