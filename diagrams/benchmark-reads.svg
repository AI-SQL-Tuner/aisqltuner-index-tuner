  <text x="324" y="451.0" font-size="17" font-weight="700" fill="#334155" text-anchor="end">All proc advice applied</text>
  <text x="324" y="529.0" font-size="17" font-weight="400" fill="#334155" text-anchor="end">AI SQL Tuner desktop app</text>
