  <line x1="1122.5" y1="200" x2="1122.5" y2="740" stroke="#E2E8F0"/>
  <text x="1122.5" y="764" font-size="13" fill="#64748B" text-anchor="middle">75%</text>
  <line x1="1410.0" y1="200" x2="1410.0" y2="740" stroke="#E2E8F0"/>
  <text x="1410.0" y="764" font-size="13" fill="#64748B" text-anchor="middle">100%</text>
  <text x="244" y="256" font-size="19" font-weight="700" fill="#334155" text-anchor="end">Batch 2</text>
  <text x="244" y="278" font-size="14" fill="#64748B" text-anchor="end">build A11117F5</text>
