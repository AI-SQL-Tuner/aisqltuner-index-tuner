<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
  <title>Are the recommendations right?</title>
  <desc>Rubric scores by batch. Required and forbidden checks: 91.3%, 95.3%, 94.7%, 100% (gpt-6.2-sol) and 99.3%. Preferred checks: 85.7%, 68.6%, 80.0%, 85.7% and 88.6%.</desc>
  <defs>
