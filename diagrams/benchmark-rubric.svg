  <text x="1288.9" y="723" font-size="16" fill="#334155">88.6%</text>
  <text x="40" y="812" font-size="14" fill="#64748B">With 5 runs per check, one run is 20 points, so the gap between batches 3 and 4 is run-to-run variance. All batches use gpt-5.6-luna except batch 5.</text>
