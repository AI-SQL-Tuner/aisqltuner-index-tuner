<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
  <title>Are the recommendations right?</title>
  <desc>Rubric scores by batch. Required and forbidden checks: 91.3%, 95.3% and 94.7%. Preferred checks: 85.7%, 68.6% and 80.0%.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B6B5AF" stroke-width="3"/>
    </pattern>
    <pattern id="hatchP" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#86b6ef" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1600" height="760" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="14" font-weight="700" letter-spacing="2.5" fill="#2563EB">AISQLTUNER-INDEX-TUNER · BENCHMARK</text>
  <text x="40" y="86" font-size="38" font-weight="800" fill="#0B2545">Are the recommendations right?</text>
  <text x="40" y="118" font-size="19" fill="#475569">Share of rubric checks passed across 5 runs per batch, on 16 known tuning problems.</text>
  <rect x="40" y="147" width="16" height="16" rx="3" fill="#2a78d6"/>
  <text x="64" y="160" font-size="15" fill="#334155">Must-do and must-never-do checks (the score that matters)</text>
  <rect x="578.2" y="147" width="16" height="16" rx="3" fill="#9ec5f4"/>
  <text x="602.2" y="160" font-size="15" fill="#334155">Preferred checks (better among acceptable answers)</text>
  <line x1="260.0" y1="200" x2="260.0" y2="650" stroke="#E2E8F0"/>
  <text x="260.0" y="674" font-size="13" fill="#64748B" text-anchor="middle">0%</text>
  <line x1="547.5" y1="200" x2="547.5" y2="650" stroke="#E2E8F0"/>
  <text x="547.5" y="674" font-size="13" fill="#64748B" text-anchor="middle">25%</text>
  <line x1="835.0" y1="200" x2="835.0" y2="650" stroke="#E2E8F0"/>
  <text x="835.0" y="674" font-size="13" fill="#64748B" text-anchor="middle">50%</text>
  <line x1="1122.5" y1="200" x2="1122.5" y2="650" stroke="#E2E8F0"/>
  <text x="1122.5" y="674" font-size="13" fill="#64748B" text-anchor="middle">75%</text>
  <line x1="1410.0" y1="200" x2="1410.0" y2="650" stroke="#E2E8F0"/>
  <text x="1410.0" y="674" font-size="13" fill="#64748B" text-anchor="middle">100%</text>
  <text x="244" y="256" font-size="19" font-weight="700" fill="#334155" text-anchor="end">Batch 2</text>
  <text x="244" y="278" font-size="14" fill="#64748B" text-anchor="end">build A11117F5</text>
  <path d="M260 216 H1305.95 Q1309.95 216 1309.95 220 V256 Q1309.95 260 1305.95 260 H260 Z" fill="#2a78d6"/>
  <text x="1320.0" y="245.0" font-size="19" font-weight="700" fill="#334155">91.3%</text>
  <path d="M260 270 H1241.5500000000002 Q1245.5500000000002 270 1245.5500000000002 274 V296 Q1245.5500000000002 300 1241.5500000000002 300 H260 Z" fill="#9ec5f4"/>
  <text x="1255.6" y="291" font-size="16" fill="#334155">85.7%</text>
  <text x="244" y="406" font-size="19" font-weight="700" fill="#334155" text-anchor="end">Batch 3</text>
  <text x="244" y="428" font-size="14" fill="#64748B" text-anchor="end">build D6C7E42C</text>
  <path d="M260 366 H1351.95 Q1355.95 366 1355.95 370 V406 Q1355.95 410 1351.95 410 H260 Z" fill="#2a78d6"/>
  <text x="1366.0" y="395.0" font-size="19" font-weight="700" fill="#334155">95.3%</text>
  <path d="M260 420 H1044.9 Q1048.9 420 1048.9 424 V446 Q1048.9 450 1044.9 450 H260 Z" fill="#9ec5f4"/>
  <text x="1058.9" y="441" font-size="16" fill="#334155">68.6%</text>
  <text x="244" y="556" font-size="19" font-weight="700" fill="#334155" text-anchor="end">Batch 4</text>
  <text x="244" y="578" font-size="14" fill="#64748B" text-anchor="end">build D6C7E42C</text>
  <path d="M260 516 H1345.05 Q1349.05 516 1349.05 520 V556 Q1349.05 560 1345.05 560 H260 Z" fill="#2a78d6"/>
  <text x="1359.0" y="545.0" font-size="19" font-weight="700" fill="#334155">94.7%</text>
  <path d="M260 570 H1176.0 Q1180.0 570 1180.0 574 V596 Q1180.0 600 1176.0 600 H260 Z" fill="#9ec5f4"/>
  <text x="1190.0" y="591" font-size="16" fill="#334155">80.0%</text>
  <text x="40" y="732" font-size="14" fill="#64748B">With 5 runs per check, one run is 20 points, so the gap between batches 3 and 4 is run-to-run variance.</text>
</svg>
